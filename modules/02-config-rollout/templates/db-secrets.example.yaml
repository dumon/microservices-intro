# Example only. Copy to ../local/db-secrets.yaml and replace both values
# for each database before creating the Secrets. The local file is ignored by Git.
apiVersion: v1
kind: Secret
metadata:
  name: songs-db-credentials
  namespace: k8s-course
type: Opaque
stringData:
  username: REPLACE_WITH_EXISTING_SONGS_DB_USER
  password: REPLACE_WITH_EXISTING_SONGS_DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: resources-db-credentials
  namespace: k8s-course
type: Opaque
stringData:
  username: REPLACE_WITH_EXISTING_RESOURCES_DB_USER
  password: REPLACE_WITH_EXISTING_RESOURCES_DB_PASSWORD
