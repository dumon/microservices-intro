apiVersion: v1
kind: Service
metadata:
  name: resources-ms # Service DNS name within the namespace; it may differ from selector.app.
  namespace: k8s-course
spec:
  type: NodePort
  selector:
    app: resources-ms # Selects Pods by template.metadata.labels.app in the Deployment.
  ports:
    - name: resources-api # Names the Service port; targetPort defines the connection to the container.
      port: 8080 # Service port used by clients inside the cluster.
      targetPort: resources-api # Matches containers[].ports[].name in resources-ms-deployment.yaml -> 8080.
      nodePort: 30080 # Kubernetes node port; it is not automatically published.
