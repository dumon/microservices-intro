apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms
  namespace: k8s-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      containers:
        - name: songs-ms
          image: dimonkiev/songs-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: songs-api
              containerPort: 8081
          env:
            - name: SONGS_MS_PORT
              value: "8081"
            - name: SONGS_DB_URL
              value: songs-db
            - name: SONGS_DB_PORT
              value: "5432"
            - name: ENABLE_EUREKA_CLIENT
              value: "false"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          readinessProbe:
            tcpSocket:
              port: songs-api
            periodSeconds: 5
