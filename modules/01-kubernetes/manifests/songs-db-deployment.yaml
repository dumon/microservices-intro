apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-db # Deployment name; the container may have a different name (postgres).
  namespace: k8s-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app: songs-db # Must match template.metadata.labels.app below.
  template:
    metadata:
      labels:
        app: songs-db # The songs-db Service selects database Pods by this label.
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres # Named container port referenced by the database Service targetPort.
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
          volumeMounts:
            - name: data # References volumes[].name below.
              mountPath: /var/lib/postgresql/data # Mounts the volume at this path inside the container.
      volumes:
        # Temporary Pod storage, deleted with the Pod; replace with a PVC later.
        - name: data
          emptyDir: {}
