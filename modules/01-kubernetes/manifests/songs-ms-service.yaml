apiVersion: v1
kind: Service
metadata:
  name: songs-ms # Service DNS name used by Resources through SONGS_MS_URL.
  namespace: k8s-course
spec:
  type: NodePort
  selector:
    app: songs-ms # Selects Pods by template.metadata.labels.app in the Deployment.
  ports:
    - name: songs-api # Names the Service port; targetPort defines the connection to the container.
      port: 8081 # Service port referenced by SONGS_MS_PORT in Resources.
      targetPort: songs-api # Matches containers[].ports[].name in songs-ms-deployment.yaml -> 8081.
      nodePort: 30081 # Kubernetes node port; it is not automatically published.
